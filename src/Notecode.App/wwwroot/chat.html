<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notecode agent</title>
<style>
  :root {
    --void:      #07090F;
    --canvas:    #0B0E17;
    --surface:   #11151F;
    --raised:    #161B27;
    --hover:     #1C2230;
    --border:    #232A3A;
    --border-2:  #2E3750;
    --text:      #E8ECF5;
    --muted:     #939DB4;
    --dim:       #7E8AA0;
    --violet:    #8B5CF6;
    --violet-2:  #A78BFA;
    --cyan:      #22D3EE;
    --mint:      #34D399;
    --amber:     #FBBF24;
    --rose:      #FB7185;
    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--canvas);
    color: var(--text);
    font-family: var(--ui);
    font-size: 13px;
    overflow: hidden;
  }

  /* Aurora: one violet bloom and one cyan bloom bleeding in from the top. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(520px 300px at 12% -8%,  rgba(139,92,246,0.20), transparent 70%),
      radial-gradient(440px 260px at 96% 2%,   rgba(34,211,238,0.13), transparent 70%);
  }

  #stream {
    position: relative; z-index: 1;
    height: 100%; overflow-y: auto; overflow-x: hidden;
    padding: 14px 14px 18px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-2) transparent;
  }
  #stream::-webkit-scrollbar { width: 10px; }
  #stream::-webkit-scrollbar-track { background: transparent; }
  #stream::-webkit-scrollbar-thumb {
    background: var(--border-2); border-radius: 8px;
    border: 3px solid var(--canvas); background-clip: padding-box;
  }
  #stream::-webkit-scrollbar-thumb:hover { background: #3C4763; background-clip: padding-box; }

  /* ------------------------------------------------------------ empty state */
  .empty {
    margin: 28px 4px 0 4px; padding: 18px 18px 16px 18px;
    border: 1px solid var(--border); border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008));
  }
  .empty h2 {
    margin: 0 0 4px 0; font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--text);
  }
  .empty p { margin: 0 0 14px 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--raised);
    color: var(--muted); font-size: 11.5px; cursor: pointer;
    transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .chip:hover { background: var(--hover); color: var(--text); border-color: var(--border-2); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet-2); }

  /* --------------------------------------------------------------- messages */
  .row { display: flex; gap: 10px; margin: 0 0 14px 0; animation: rise 220ms ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .avatar {
    flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(139,92,246,0.30), rgba(34,211,238,0.18));
    border: 1px solid var(--border-2);
  }
  .avatar svg { width: 15px; height: 15px; }

  .body { flex: 1 1 auto; min-width: 0; }
  .who {
    font-family: var(--display); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 4px; display: flex; align-items: center; gap: 7px;
  }
  .who .tag {
    font-size: 9.5px; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); text-transform: none;
  }

  .bubble {
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px;
    background: var(--surface); line-height: 1.6; font-size: 12.5px;
    overflow-wrap: anywhere;
  }
  .bubble.user {
    background: linear-gradient(180deg, rgba(139,92,246,0.14), rgba(139,92,246,0.07));
    border-color: rgba(167,139,250,0.32);
  }

  /* A picture the user attached. The thumbnail is capped so a big photo does not
     push the conversation off the screen. */
  .shot {
    display: block; max-width: 300px; max-height: 220px; margin: 0 0 8px;
    border-radius: 9px; border: 1px solid rgba(167,139,250,0.32);
  }
  .shotrow { margin-bottom: 8px; }
  .shotrow .shot { margin-bottom: 0; }

  /* A file the user attached: the paperclip and the name, so the transcript says
     what is going into the model and not only the picture. */
  .filechip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 7px; margin-bottom: 8px;
    border-radius: 9px; border: 1px solid rgba(167,139,250,0.32);
    background: rgba(139,92,246,0.10);
    color: var(--cyan); font-size: 12px; max-width: 100%;
  }
  .filechip svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .filechip .fname {
    color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bubble pre {
    margin: 8px 0 0 0; padding: 9px 11px; border-radius: 9px;
    background: var(--void); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; overflow-x: auto; white-space: pre;
  }
  .bubble code { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); }
  .bubble pre code { color: var(--text); font-size: inherit; }
  .bubble ul { margin: 6px 0 0 0; padding-left: 18px; }
  .bubble li { margin: 2px 0; }
  .bubble strong { color: #fff; font-weight: 600; }
  .bubble h3 { margin: 8px 0 4px 0; font-family: var(--display); font-size: 12.5px; color: var(--text); }

  /* -------------------------------------------------------- command output */
  .note {
    border: 1px solid rgba(167,139,250,0.28); border-left: 2px solid var(--violet-2);
    border-radius: 10px; padding: 9px 12px; background: rgba(139,92,246,0.07);
    line-height: 1.6; font-size: 12.5px; overflow-wrap: anywhere;
  }
  .note pre {
    margin: 8px 0 0 0; padding: 9px 11px; border-radius: 9px;
    background: var(--void); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; overflow-x: auto; white-space: pre;
  }
  .note code { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); }
  .note pre code { color: var(--text); font-size: inherit; }
  .note ul { margin: 6px 0 0 0; padding-left: 18px; }
  .note li { margin: 2px 0; }
  .note strong { color: #fff; font-weight: 600; }
  .note h3 { margin: 8px 0 4px 0; font-family: var(--display); font-size: 12.5px; color: var(--text); }

  /* ----------------------------------------------------------- tool call card */
  .tool {
    border: 1px solid var(--border); border-left: 2px solid var(--cyan);
    border-radius: 10px; background: var(--surface); overflow: hidden; margin-top: 2px;
  }
  .tool .head {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    background: rgba(34,211,238,0.05);
  }
  .tool .name {
    font-family: var(--mono); font-size: 11.5px; color: var(--cyan); font-weight: 600;
  }
  .tool .kind {
    font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--dim); margin-left: auto;
  }
  .tool .payload {
    margin: 0; padding: 8px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.5;
    color: var(--muted); background: var(--void); white-space: pre-wrap; overflow-wrap: anywhere;
    border-top: 1px solid var(--border);
    max-height: 190px; overflow-y: auto;
  }
  .tool .payload.ok { color: var(--mint); }
  .tool .payload.err { color: var(--rose); }

  /* ---------------------------------------------------------------- log line */
  .log {
    display: flex; gap: 8px; align-items: flex-start; margin: 0 0 8px 0;
    font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--dim);
  }
  .log .bullet { color: var(--border-2); flex: 0 0 auto; }
  .log.warn { color: var(--amber); }
  .log.err  { color: var(--rose); }
  .log.ok   { color: var(--mint); }

  /* --------------------------------------------------------------- streaming */
  .caret {
    display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px;
    background: var(--cyan); border-radius: 1px; animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  .thinking { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
  .thinking i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--violet-2);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .thinking i:nth-child(2) { animation-delay: 0.15s; }
  .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

  /* The activity row: what the agent is doing right now, and what it is thinking
     about it. The thinking goes on the line under the blinker. */
  .activity { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0; }
  .activity .ico {
    width: 15px; height: 15px; flex: 0 0 auto; color: var(--cyan);
    animation: breathe 1.8s ease-in-out infinite;
  }
  .activity .ico svg { width: 15px; height: 15px; display: block; }
  .activity .what { font-size: 12px; color: var(--muted); }
  .activity .what b { color: var(--cyan); font-weight: 600; }
  @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  .reasoning {
    flex-basis: 100%;
    margin: 7px 0 2px 0;
    padding: 8px 11px;
    border-left: 2px solid rgba(34,211,238,0.42);
    background: rgba(34,211,238,0.05);
    border-radius: 0 8px 8px 0;
    font-size: 12px; line-height: 1.6; color: var(--muted);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .reasoning:empty { display: none; }
  .reasoning.folded { display: none; }
  .activity .secs { color: var(--dim, #7E8AA0); font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* Once the answer starts, the thinking folds into one line, the way Claude does
     it. Clicking the line opens it again. */
  .thought {
    flex-basis: 100%; text-align: left; margin: 6px 0 0 0; padding: 0;
    background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--muted);
  }
  .thought::before { content: '▸ '; color: var(--cyan); }
  .thought.open::before { content: '▾ '; }
  .thought:hover { color: var(--text, #E8ECF5); }
  .thought:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; border-radius: 3px; }
  .reasoning .caret { height: 12px; }

  /* Once the answer has arrived the row is history: the blinker and the icon stop
     moving, but both stay where they are so they can be read. */
  .thinking.done i { animation: none; opacity: 0.45; }
  .activity.done .ico { animation: none; opacity: 0.7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="stream" role="log" aria-live="polite" aria-label="Agent conversation"></div>

<script>
(function () {
  var stream = document.getElementById('stream');
  var current = null;      // the assistant bubble being streamed into
  var currentText = '';
  var atBottom = true;

  stream.addEventListener('scroll', function () {
    atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 40;
  });

  function scrollDown() { if (atBottom) stream.scrollTop = stream.scrollHeight; }

  function post(msg) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
  }

  /* ------------------------------------------------------------- rendering */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* A deliberately small markdown subset: fenced code, inline code, bold, headings,
     bullet lists. Everything is escaped first, so nothing from the model can inject
     markup. */
  function md(src) {
    var out = [];
    var parts = String(src).split(/```/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        out.push('<pre><code>' + esc(parts[i].replace(/^[a-zA-Z0-9+#-]*\n/, '')) + '</code></pre>');
        continue;
      }
      var lines = parts[i].split('\n');
      var inList = false;
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        var bullet = line.match(/^\s*[-*]\s+(.*)$/);
        if (bullet) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + inline(bullet[1]) + '</li>');
          continue;
        }
        if (inList) { out.push('</ul>'); inList = false; }
        if (/^###\s+/.test(line)) {
          out.push('<h3>' + inline(line.replace(/^###\s+/, '')) + '</h3>');
        } else if (/^##\s+/.test(line)) {
          out.push('<h3>' + inline(line.replace(/^##\s+/, '')) + '</h3>');
        } else if (/^#\s+/.test(line)) {
          out.push('<h3>' + inline(line.replace(/^#\s+/, '')) + '</h3>');
        } else if (line.trim() === '') {
          out.push('');
        } else {
          out.push(inline(line) + '<br/>');
        }
      }
      if (inList) out.push('</ul>');
    }
    return out.join('');
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  var AGENT_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="5.5" r="2.4" fill="#A78BFA" stroke="none"/>' +
    '<circle cx="5" cy="17" r="2.4" fill="#22D3EE" stroke="none"/>' +
    '<circle cx="19" cy="17" r="2.4" fill="#22D3EE" stroke="none"/>' +
    '<path d="M10.8 7.6 6.6 15.2M13.2 7.6l4.2 7.6M7.4 17h9.2" stroke="#8B5CF6"/></svg>';

  function agentAvatar() {
    var a = document.createElement('div');
    a.className = 'avatar';
    a.innerHTML = AGENT_SVG;
    return a;
  }

  /* The paperclip, drawn: three nested hooks on a diagonal. */
  function paperclipSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
           'stroke-linecap="round" stroke-linejoin="round">' +
           '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19' +
           'a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
  }

  function clearEmpty() {
    var e = document.querySelector('.empty');
    if (e) e.remove();
  }

  /* ------------------------------------------------------------- builders */
  function addUser(text, image, file) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="avatar" style="background:linear-gradient(135deg,rgba(34,211,238,0.26),rgba(139,92,246,0.14))">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
      '</div>' +
      '<div class="body"><div class="who">you</div>' +
      '<div class="bubble user">' +
      (image ? '<div class="shotrow"><img class="shot" src="' + image + '" alt="attached image"></div>' : '') +
      (file ? '<div class="shotrow"><span class="filechip">' + paperclipSvg() +
              '<span class="fname">' + esc(file) + '</span></span></div>' : '') +
      md(text) + '</div></div>';
    stream.appendChild(row);
    scrollDown();
  }

  function addAssistant(text) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row';
    var av = agentAvatar();
    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = '<div class="who">notecode agent</div>';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = md(text);
    body.appendChild(bubble);
    row.appendChild(av);
    row.appendChild(body);
    stream.appendChild(row);
    scrollDown();
    return bubble;
  }

  function addNote(text, kind) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row';
    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = '<div class="who">' + esc(kind || 'notecode') + '</div>';
    var box = document.createElement('div');
    box.className = 'note';
    box.innerHTML = md(text);
    body.appendChild(box);
    row.appendChild(body);
    stream.appendChild(row);
    scrollDown();
  }

  function addTool(name, args, output) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'row';
    row.appendChild(agentAvatar());
    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = '<div class="who">tool call</div>';

    var card = document.createElement('div');
    card.className = 'tool';
    var head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<span class="name">' + esc(name) + '</span><span class="kind">mcp</span>';
    card.appendChild(head);

    var argBlock = document.createElement('pre');
    argBlock.className = 'payload';
    argBlock.textContent = args;
    card.appendChild(argBlock);

    if (output) {
      var out = document.createElement('pre');
      out.className = 'payload' + (/^\[error/.test(output) ? ' err' : ' ok');
      out.textContent = output;
      card.appendChild(out);
    }

    body.appendChild(card);
    row.appendChild(body);
    stream.appendChild(row);
    scrollDown();
  }

  function addLog(text, level) {
    clearEmpty();
    var row = document.createElement('div');
    row.className = 'log' + (level ? ' ' + level : '');
    row.innerHTML = '<span class="bullet">▸</span><span>' + esc(text) + '</span>';
    stream.appendChild(row);
    scrollDown();
  }

  function showThinking() {
    clearEmpty();
    if (current) return;
    var row = document.createElement('div');
    row.className = 'row';
    row.id = 'thinking';
    row.appendChild(agentAvatar());
    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = '<div class="who">notecode agent</div>' +
      '<div class="thinking"><i></i><i></i><i></i></div>';
    row.appendChild(body);
    stream.appendChild(row);
    scrollDown();
  }

  /* What the agent is doing right now, and what it thinks about it. */
  var ICONS = {
    think: '<path d="M12 3l1.9 4.9L19 9.8l-5.1 1.9L12 16.6l-1.9-4.9L5 9.8l5.1-1.9z"/>' +
           '<path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
    read:  '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>' +
           '<path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>',
    write: '<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5 3 20l1.5-4.5z"/>',
    run:   '<path d="M4 17l6-5-6-5"/><path d="M12 19h8"/>',
    move:  '<path d="M2 12h20"/><path d="M12 2v20"/><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/>' +
           '<path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/>',
    folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    copy:  '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    remove:'<path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>' +
           '<path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>',
    list:  '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/>',
    open:  '<path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
  };

  function iconSvg(kind) {
    var body = ICONS[kind] || ICONS.think;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
           'stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }

  function activityRow() {
    var t = document.getElementById('thinking');
    if (t) return t;
    showThinking();
    return document.getElementById('thinking');
  }

  /* A seconds counter next to what the agent is doing. A cloud model can think for
     half a minute before it writes a word; a number that keeps moving says the app
     is waiting, not frozen. */
  var actTimer = null, actStart = 0, actLabel = '';

  function stopTimer() {
    if (actTimer) { clearInterval(actTimer); actTimer = null; }
  }

  function tick() {
    var row = document.getElementById('thinking');
    var what = row && row.querySelector('.activity .what');
    if (!what) { stopTimer(); return; }
    var secs = Math.floor((Date.now() - actStart) / 1000);
    what.innerHTML = '<b>' + esc(actLabel) + '</b>' + (secs > 0 ? '<span class="secs">' + secs + 's</span>' : '');
  }

  /* Show what the agent is doing. The row is made once and then updated, so the
     blinker does not jump around while the agent works. */
  function showActivity(kind, label) {
    var row = activityRow();
    if (!row) return;
    var body = row.querySelector('.body');
    if (!body) return;

    var act = body.querySelector('.activity');
    if (!act) {
      var old = body.querySelector('.thinking');
      if (old) old.remove();
      act = document.createElement('div');
      act.className = 'activity';
      act.innerHTML = '<span class="ico"></span><span class="what"></span>' +
                      '<span class="thinking"><i></i><i></i><i></i></span>' +
                      '<div class="reasoning"></div>';
      body.appendChild(act);
    }

    // A new turn means new thinking, so the reasoning from the last one goes.
    if (kind === 'think') {
      var box = act.querySelector('.reasoning');
      if (box) { box.textContent = ''; box.classList.remove('folded'); }
      var fold = act.querySelector('.thought');
      if (fold) fold.remove();
    }

    act.classList.remove('done');
    act.querySelector('.ico').innerHTML = iconSvg(kind);
    actLabel = label || 'Working';
    actStart = Date.now();
    stopTimer();
    tick();
    actTimer = setInterval(tick, 1000);
    scrollDown();
  }

  /* The thinking folds into one line once the answer starts. */
  function foldReasoning(row) {
    var box = row.querySelector('.reasoning');
    if (!box || box.classList.contains('folded') || !box.textContent.trim()) return;
    var secs = Math.max(1, Math.round((Date.now() - actStart) / 1000));
    var fold = row.querySelector('.thought');
    if (!fold) {
      fold = document.createElement('button');
      fold.type = 'button';
      fold.className = 'thought';
      fold.addEventListener('click', function () {
        box.classList.toggle('folded');
        fold.classList.toggle('open', !box.classList.contains('folded'));
      });
      box.parentNode.insertBefore(fold, box);
    }
    fold.textContent = 'Thought for ' + secs + 's';
    fold.setAttribute('aria-label', 'Thought for ' + secs + ' seconds. Show the thinking.');
    fold.classList.remove('open');
    box.classList.add('folded');
  }

  /* The thinking goes on the line under the blinker, and it streams in. */
  function addReasoning(text) {
    if (!text) return;
    var row = activityRow();
    if (!row) return;
    var box = row.querySelector('.reasoning');
    if (!box) return;
    box.textContent += text;
    scrollDown();
  }

  /* The blinker stops when the answer starts, but the row stays: the icon and the
     reasoning under it have to be there to be read. */
  function stopBlinker() {
    stopTimer();
    var row = document.getElementById('thinking');
    if (!row) return;
    foldReasoning(row);
    var dots = row.querySelector('.thinking');
    if (dots) dots.classList.add('done');
    var act = row.querySelector('.activity');
    if (act) act.classList.add('done');
  }

  function hideThinking() {
    var t = document.getElementById('thinking');
    if (!t) return;
    // A row that only holds the plain blinker has nothing worth keeping.
    if (!t.querySelector('.activity')) { t.remove(); return; }
    stopBlinker();
  }

  /* A new question gets its own activity row, so the icon and the thinking stay
     next to the question they belong to. */
  function removeActivityRow() {
    stopTimer();
    var t = document.getElementById('thinking');
    if (t) t.remove();
  }

  function showEmpty() {
    if (stream.querySelector('.empty')) return;
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML =
      '<h2>notecode agent</h2>' +
      '<p>The model runs locally on your CPU and can read and write the workspace. ' +
      'Ask it to save a file and it will pick the extension and open it here.</p>' +
      '<div class="chips">' +
      '<div class="chip" data-p="Save a markdown file named plan.md with the content \\"# Plan\\""><span class="dot"></span>save as plan.md</div>' +
      '<div class="chip" data-p="Save a C++ source file named main.cpp"><span class="dot"></span>save as main.cpp</div>' +
      '<div class="chip" data-p="Save an HTML page named index.html"><span class="dot"></span>save as index.html</div>' +
      '<div class="chip" data-p="List the files in the workspace"><span class="dot"></span>list files</div>' +
      '</div>';
    e.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        post({ type: 'prompt', text: chip.getAttribute('data-p') });
      });
    });
    stream.appendChild(e);
  }

  /* --------------------------------------------------------------- host bus */
  function onHostMessage(e) {
    var m = e.data;
    if (!m) return;
    switch (m.type) {
      case 'user':
        removeActivityRow();
        addUser(m.text || '', m.image || '', m.file || '');
        break;

      case 'thinking':
        showThinking();
        break;

      case 'activity':
        showActivity(m.kind, m.label);
        break;

      case 'reasoning':
        addReasoning(m.text || '');
        break;

      case 'delta':
        hideThinking();
        if (!current) current = addAssistant('');
        currentText += m.text || '';
        current.innerHTML = md(currentText) + '<span class="caret"></span>';
        scrollDown();
        break;

      case 'assistant':
        hideThinking();
        if (current) { current.innerHTML = md(m.text || ''); current = null; currentText = ''; }
        else addAssistant(m.text || '');
        scrollDown();
        break;

      case 'tool':
        hideThinking();
        current = null; currentText = '';
        addTool(m.name || 'tool', m.args || '', m.output || '');
        break;

      case 'log':
        hideThinking();
        addLog(m.text || '', m.level || '');
        break;

      case 'note':
        hideThinking();
        current = null; currentText = '';
        addNote(m.text || '', m.kind || 'notecode');
        break;

      case 'clear':
        stream.innerHTML = '';
        current = null; currentText = '';
        showEmpty();
        break;
    }
  }

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', onHostMessage);
  } else {
    window.addEventListener('message', onHostMessage);
  }

  showEmpty();
  post({ type: 'ready' });
})();
</script>
</body>
</html>
